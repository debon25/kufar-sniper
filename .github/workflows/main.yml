name: Kufar Sniper 24/7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: kufar-bot-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Восстановление базы и кэша рынка
        uses: actions/cache@v4
        with:
          path: |
            seen_ads.json
            market_cache.json
            seen_sellers.json
          key: sniper-cache-${{ github.run_id }}
          restore-keys: |
            sniper-cache-

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка requests
        run: pip install requests

      - name: Запуск парсера
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_RUN_HOURS: '5.8'
        run: python -u bot.py
